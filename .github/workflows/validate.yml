name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  app-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Check deploy hygiene
        run: python scripts/check_deploy_hygiene.py

      - name: Run backend tests
        run: pytest backend/tests -q

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend unit tests
        run: npm --prefix frontend test -- --run

      - name: Run frontend type check
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

  hr-e2e:
    if: ${{ secrets.TALENT_OPENAI_API_KEY != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright browser
        run: npm --prefix frontend run test:e2e:install

      - name: Run local HR flow E2E
        env:
          TALENT_REVIEW_PROVIDER: openai
          TALENT_OPENAI_API_KEY: ${{ secrets.TALENT_OPENAI_API_KEY }}
        run: ./scripts/hr_e2e.sh

  production-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Check deploy hygiene
        run: python scripts/check_deploy_hygiene.py

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright browser
        run: npm --prefix frontend run test:e2e:install

      - name: Verify production deployment
        env:
          PLAYWRIGHT_BASE_URL: https://talent-sourcing-tool-zeta.vercel.app
        run: ./scripts/verify_production.sh
